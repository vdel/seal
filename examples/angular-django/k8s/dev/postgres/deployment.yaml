apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from the
        # dummy dev Secret (./secret.yaml) instead of being hardcoded here
        # -- see its header for why.
        envFrom:
        - secretRef:
            name: postgresql
        env:
        # On some storage backends (e.g. real cloud block volumes, unlike
        # Kind's local-path provisioner) the volume's mount point already
        # contains a lost+found directory, and initdb refuses to initialize
        # into a non-empty directory. Point PGDATA at a subdirectory of the
        # mount instead, per the postgres image's own guidance.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            # Exec probes can't reference a Secret value directly -- "app"
            # must match secret.yaml's POSTGRES_USER.
            command: ["pg_isready", "-U", "app"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

