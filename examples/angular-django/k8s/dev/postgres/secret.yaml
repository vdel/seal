# Dummy credentials for the bundled dev/CI Postgres instance (see
# ./deployment.yaml). Mimics the Secret provisioned for this app's Postgres
# backing service in a real environment -- same name
# ("postgresql") and same POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
# keys -- just scoped to this throwaway, Kind-cluster-only database instead
# of a real one.
#
# Safe to commit: this instance only ever exists inside a local `seal up`
# cluster or a CI Kind cluster, never
# reachable from outside it. A real environment doesn't deploy this Postgres
# at all: its own overlay repoints DATABASE_URL at an externally provisioned
# instance instead.
apiVersion: v1
kind: Secret
metadata:
  name: postgresql
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app-dev-password
  POSTGRES_DB: app
