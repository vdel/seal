# The object this session's api container reads its credentials from.
#
# Named here rather than by seal: which object carries which values
# into a pod is a per-environment fact, and it is already stated in the
# Deployment's own `envFrom` beside this file. An environment that provisions
# its secrets some other way replaces this manifest with whatever populates
# the same name there -- an ExternalSecret, a SealedSecret, a CSI-driver
# target -- and the Deployment does not change at all.
#
# `fill-from` names the service whose `.env` fills it. No `keys` list, so it
# claims every key services/api/.env declares that no other object claims,
# which in this overlay is all of them: adding a secret stays one line in
# `.env`.
#
# "That no other object claims" is what makes splitting cost nothing here:
# k8s/non-dev declares a ConfigMap naming DEBUG, and this same manifest
# claims the remainder there without a word about it.
apiVersion: v1
kind: Secret
metadata:
  name: example-api-secrets
  annotations:
    seal-test.dev/fill-from: api
type: Opaque
