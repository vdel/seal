name: Seal CI
description: >
  Build a Seal project on a throwaway Kind cluster, run each service's own
  tests and the project's outcome suite, and report what every run found.

# The generic build -> test pipeline: check out, install Tilt/ctlptl/uv, spin
# up a throwaway Kind cluster, run `seal ci` -- which runs each service's own
# tests inside its running container -- run the project's outcome suite
# against the environment that just came up, and hand back what every run
# found. So a green run means two things: the environment came up, and every
# promise the project has translated still holds. `run_service_tests` and
# `run_outcomes`, below, say whether a run reads either -- a faster check to
# have beside the gate rather than a gate of its own, down to one that reads
# neither and gates on readiness alone.
#
# What makes that a usable merge gate is `seal ci` exiting successfully only
# once *every* resource is ready -- so it refuses to start at all until each
# Deployment declares a `readinessProbe`, without which Kubernetes reports a
# container Ready the instant its process starts. It never touches a real
# cluster.
#
# An action rather than a reusable workflow, and that decides two things
# below.
#
# The `seal` CLI lives in this repository, in `python/`. An action gets its
# own repository checked out and $GITHUB_ACTION_PATH pointing into it, so the
# CLI is simply there -- at the same revision as this file, needing no
# credential and unable to drift from it. A reusable workflow gets only its
# `.yml`, leaving the CLI to be named by the caller and resolved separately:
# either vendored as a git submodule or fetched by git reference, and pinned
# by hand at a revision that has to match.
#
# It also runs inside the caller's job, so that job binds `environment:` and
# every secret resolves there, against the right Environment, arriving here
# as an ordinary input. A reusable workflow cannot be called from a job that
# binds an Environment, which forces the callee to bind it -- and a
# per-environment credential can then only be reached by passing its NAME for
# the callee to look up.
#
# One pin is left, and it is the one this cannot close: a project's own root
# Tiltfile registers the Starlark half with `v1alpha1.extension_repo(ref=...)`.
# The Starlark and the Python are one library, so that ref and the ref this
# action is used at have to name the same revision.
#
# Publishing an image to a real registry, deploying an overlay that names a
# real environment, and sealing credentials for one are a deployment
# toolkit's job, not this one's.

inputs:
  project_dir:
    description: "Path (relative to the repo root) to the project's root Tiltfile/services."
    required: true
  k8s_overlay:
    description: >
      Which of the project's Kubernetes overlays the gate runs against.
      This is the shape whose run also executes each service's own tests,
      so it should be the one a developer brings up locally: a gate on a
      shape nobody can reproduce is one nobody can act on.
    required: true
  additional_k8s_overlays:
    description: >
      Further overlays to verify the promises against, as a JSON list of
      strings -- e.g. '["prod-like"]'. Each runs the outcome suite alone,
      against the images a real environment runs. Empty by default: how
      much a second shape adds depends on what that overlay changes, so
      whether to have one is the project's call.
    required: false
    default: '[]'
  run_service_tests:
    description: >
      Whether the run on `k8s_overlay` executes each service's own tests --
      "true" or "false", true by default. It is the only run that can:
      a suite runs inside the service's container, so it exists only in
      images built at --build_type test, and this input is what decides
      which kind that run builds.

      Turned off it builds the images a real environment runs, and reads
      the promises against them -- which is what `additional_k8s_overlays`
      does for a second shape, on the shape the local loop brings up.
    required: false
    default: 'true'
  run_outcomes:
    description: >
      Whether these runs read the project's promises -- "true" or "false",
      true by default. Turned off, what is left is each service's own
      tests, run inside its container by the run on `k8s_overlay`, and the
      readiness every `seal ci` gates on.

      A run with this off is not the merge gate. It says the environment
      comes up and each service's own suite passes, and nothing at all
      about whether the application still does what it promises -- so it
      is worth having beside the gate, as the faster of two checks, and
      never instead of it.

      It also leaves `additional_k8s_overlays` nothing to do: those runs
      build images that carry no test suite, so the promises are the only
      thing they read. Asking for both is refused rather than deploying
      shapes that would assert nothing.

      Off alongside `run_service_tests` it leaves a run that reads nothing
      and gates on readiness alone: the images build, the manifests apply,
      every resource comes up. Allowed deliberately, for the emergency
      where that is the question. No results come back from such a run, so
      the job's own status is the whole of what it says.
    required: false
    default: 'true'
  publish_images:
    description: >
      Whether to push the images this project builds, after every gate
      above has passed. Read as the string "true"; anything else, the
      literal "false" included, publishes nothing. Its own job-ordering question rather than a flag
      on the runs: Tilt pushes when it deploys, not when a run succeeds,
      so publishing during a gate would publish before a single test had.
    required: true
  publish_k8s_overlay:
    description: >
      Which overlay the publishing run deploys. Publishing means
      deploying something and letting Tilt push what it built, so it
      still names a shape -- and the one it names should be the one the
      deployment will use. Required in practice whenever publish_images
      is true; the run fails saying so rather than silently deploying
      whatever the project defaults to.
    required: false
    default: ''
  ref:
    description: "Branch name or SHA to check out. Defaults to the triggering ref."
    required: false
    default: ''
  provider_setup:
    description: >
      Shell run before `seal ci`, putting every CLI this project's
      credential declarations name (seal-credentials-config.json) on
      PATH and authenticating it. The credential reaches it as
      $SEAL_PROVIDER_TOKEN, from `provider_token` below.

      Optional, and correct empty: a project whose `.env` files hold only
      literals and `k8s://` markers reaches no provider, needs no CLI,
      and should not have to say so.

      Shell rather than an action to `uses:`, deliberately. A reusable
      workflow resolves `uses: ./...` against the *caller's* checkout, so
      a local action reference works for a caller inside this repository
      and breaks every caller outside it -- the same trap the job's own
      steps are arranged around.
    required: false
    default: ''
  credentials_env:
    description: >
      Which of the project's credentials environments this run reads --
      which store each `.env` reference resolves against, per that
      project's own seal-credentials-config.json. Reaches `seal ci` as
      SEAL_CREDENTIALS_ENV.

      Optional: left empty, the project's own `default_env` applies. seal
      has no default of its own, so a project that declares neither and
      references a provider fails saying which three things could name
      one. Deliberately independent of k8s_overlay -- verifying a
      production-shaped overlay on a throwaway cluster is exactly what
      that input exists for, and deriving credentials from it would make
      such a run reach real secrets.
    required: false
    default: ''
  results_artifact:
    description: >
      Name of the artifact this run uploads its results to -- every JUnit
      report and whatever else each run left in tests-results/, filed
      under the overlay that produced it, plus the reading of all of them
      (results.json) and a self-contained page of it (index.html,
      report.md). Also reported as an output, so a caller downloading it
      names it once.

      An artifact name has to be unique within a workflow run, so a
      caller that calls this workflow more than once (several projects in
      one repository, say) gives each call its own name.
    required: false
    default: 'tests-results'
  results_retention_days:
    description: >
      How long the results artifact is kept. It exists to be consumed by
      the caller's own reporting, in the same run, so the default is
      short: what a reader comes back to weeks later is the report the
      caller published from it, not this. Raise it if opening a failed
      run's raw XML later is worth the storage.
    required: false
    default: 7
  provider_token:
    description: >
      One credential for `provider_setup` to authenticate with, reaching it
      as $SEAL_PROVIDER_TOKEN. Which store it opens, and which scope of it,
      is the project's business -- nothing here learns either.

      The calling job binds `environment:` and reads its own name for this,
      so a run against one environment resolves that environment's store and
      no other. Optional: a project whose `.env` files hold only literals
      reaches no provider, and one authenticating another way -- a cloud
      workload identity, say -- does whatever it needs in `provider_setup`.
    required: false
    default: ''
  submodules_token:
    description: >
      Read access to whatever the checkout below needs beyond the calling
      repository itself -- a private git submodule the project vendors.
      GITHUB_TOKEN is scoped to the repository whose workflow is running and
      can read no other, so without this such a submodule fails to clone
      before any later step runs.

      Nothing about Seal itself needs it: the CLI is this action's own
      repository, checked out beside it.
    required: false
    default: ''

outputs:
  overlays:
    description: "Every overlay this run verified, as a JSON array -- what a caller fans a per-overlay job out over."
    value: ${{ steps.plan.outputs.overlays }}
  results:
    description: >
      What every run found, for a caller to report however it presents
      results. `{}` when no run was asked to read anything -- a run with
      both `run_service_tests` and `run_outcomes` off -- which is an
      absence of reports by design rather than a run that lost them.
    value: ${{ steps.collect.outputs.results }}
  results_artifact:
    description: "The name this run uploaded its results under, so a caller downloading it names it once."
    value: ${{ inputs.results_artifact }}
  results_artifact_url:
    description: >
      Where that artifact can be downloaded. A file inside it has no address
      of its own -- the artifact is one archive -- so this is as close as a
      report published outside the run can get to the recording of a failure.
      Empty where nothing was uploaded.
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Make an in-cluster config undetectable
      # Blank, not unset-by-omission: a job running on an in-cluster runner
      # is itself a pod, and client-go treats that as a Kubernetes client.
      # Its namespace resolution takes the kubeconfig's context namespace,
      # and when that is empty or "default" -- which is exactly what `kind`
      # writes -- falls back to the *pod's own* namespace from its mounted
      # service account. Tilt then deploys into whatever namespace the runner
      # happens to live in on the host cluster, which does not exist in the
      # kind cluster it just created:
      #   kubernetes apply retry: namespaces "actions-runner-system" not found
      # Clearing these makes an in-cluster config impossible to detect, so
      # every k8s client in this job resolves against the kubeconfig alone.
      # No-op on a hosted runner, where they are unset to begin with.
      #
      # Written to $GITHUB_ENV rather than declared once for the job: an
      # action has no job-level `env:`, and $GITHUB_ENV is what carries a
      # value into every step after this one.
      shell: bash
      run: |
        {
          echo "KUBERNETES_SERVICE_HOST="
          echo "KUBERNETES_SERVICE_PORT="
        } >> "$GITHUB_ENV"

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref || github.ref }}
        # A project vendoring something of its own as a submodule needs its
        # contents actually checked out, not left as an empty directory
        # (actions/checkout's own default). Nothing about Seal is vendored:
        # the CLI is this action's own repository.
        submodules: true
        # What a *private* submodule's clone authenticates as. The default
        # GITHUB_TOKEN can read only the repository whose workflow is
        # running, so without this a caller vendoring one privately fails
        # here, before any later step runs. See the `submodules_token` input.
        token: ${{ inputs.submodules_token || github.token }}

    - name: Prepare a writable tool directory
      # Every tool installed below lands here rather than in /usr/local/bin,
      # and $GITHUB_PATH puts it on PATH for every later step. /usr/local/bin
      # needs sudo, which is a property of whichever image the calling job
      # runs on rather than something this action can assume; a
      # directory under $HOME always works. tilt-dev's own install.sh picks
      # this exact directory once it's on PATH, so Tilt lands here too
      # without needing to be told.
      shell: bash
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Wait for the Docker daemon
      # Tilt, ctlptl/kind and buildx below all talk to a Docker daemon.
      # GitHub's hosted runners have one up before the job starts; an
      # in-cluster runner gets one from a sidecar container that boots
      # alongside the runner itself, so the socket can still be missing for
      # the first seconds of a job.
      shell: bash
      run: |
        for _ in $(seq 60); do
          if docker info >/dev/null 2>&1; then
            exit 0
          fi
          sleep 2
        done
        echo "No Docker daemon reachable at ${DOCKER_HOST:-unix:///var/run/docker.sock} after two minutes."
        docker info || true
        exit 1

    - name: Install uv
      # No separate `actions/setup-python`: `seal` is invoked through `uvx`
      # below, and uv provisions an interpreter matching python/'s own
      # requires-python itself. That interpreter is a self-contained build,
      # so it needs nothing from the runner image -- the same reason
      # internal-seal-tests.yml installs only uv.
      uses: astral-sh/setup-uv@v8.1.0

    - name: Plan the overlays this run verifies
      id: plan
      # Early, and before anything that can fail on a slow network: the
      # `overlays` output is what a caller reports per shape from, and a job
      # that died before saying which shape it was running leaves nothing to
      # report under. The same goes for a combination of inputs that asks for
      # nothing coherent -- better said here, in one line naming the inputs,
      # than after twenty minutes of cluster.
      #
      # Parsed rather than pasted through: a malformed
      # additional_k8s_overlays should say so here rather than reaching a
      # shell loop as a `[` and being verified as an overlay by that name.
      # And each of the two halves a run can switch off is checked against
      # the two words it takes, so a third one is refused instead of reading
      # as "not true" -- verifying less is a thing a run says, never
      # something a typo does. Both off is a run that gates on readiness
      # alone, which is allowed and says so where it runs.
      env:
        PRIMARY_K8S_OVERLAY: ${{ inputs.k8s_overlay }}
        ADDITIONAL_K8S_OVERLAYS: ${{ inputs.additional_k8s_overlays }}
        RUN_SERVICE_TESTS: ${{ inputs.run_service_tests }}
        RUN_OUTCOMES: ${{ inputs.run_outcomes }}
      shell: bash
      run: |
        uv run --no-project python - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os, sys

        def switch(name):
            value = os.environ[name.upper()].strip()
            if value not in ("true", "false"):
                sys.exit(
                    "{} must be \"true\" or \"false\", got {!r}.".format(
                        name, value
                    )
                )
            return value

        run_service_tests = switch("run_service_tests")
        run_outcomes = switch("run_outcomes")

        raw = os.environ["ADDITIONAL_K8S_OVERLAYS"].strip() or "[]"
        try:
            additional = json.loads(raw)
        except ValueError:
            sys.exit(
                "additional_k8s_overlays is not JSON: {!r}. It takes a list of "
                "overlay names, e.g. '[\"prod-like\"]'.".format(raw)
            )
        if not isinstance(additional, list) or not all(isinstance(o, str) for o in additional):
            sys.exit(
                "additional_k8s_overlays must be a JSON list of strings, got "
                "{!r}.".format(raw)
            )

        if additional and run_outcomes == "false":
            sys.exit(
                "additional_k8s_overlays names {} and run_outcomes is false. An "
                "additional shape is verified at --build_type runtime, whose "
                "images carry no test suite, so the promises are the only thing "
                "such a run reads -- with them off it would deploy a shape to "
                "assert nothing. Clear one input or the other.".format(
                    ", ".join(additional)
                )
            )

        print("overlays=" + json.dumps([os.environ["PRIMARY_K8S_OVERLAY"]] + additional))
        # Newline-delimited for the shell loop that runs them, which wants
        # names rather than JSON.
        with open(os.environ["RUNNER_TEMP"] + "/additional-overlays", "w") as f:
            f.write("".join(o + "\n" for o in additional))
        PY

    - name: Install Tilt
      # Run from a scratch dir, not the checkout: tilt-dev's own install.sh
      # extracts the release tarball's "tilt" member into the *current*
      # working directory (`tar -xzv tilt`) before moving it onto PATH --
      # since this repo has a top-level tilt/ directory (the Tilt
      # extensions, see /tilt/README.md), running it from the checkout root
      # fails with "tar: tilt: Cannot open: File exists" (a non-empty
      # directory can't be replaced by a same-named file).
      working-directory: ${{ runner.temp }}
      shell: bash
      run: |
        curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash

    - name: Install ctlptl
      shell: bash
      run: |
        curl -fsSL https://github.com/tilt-dev/ctlptl/releases/download/v0.9.3/ctlptl.0.9.3.linux.x86_64.tar.gz | tar -xzv -C "$HOME/.local/bin" ctlptl

    - name: Install kubectl and kind
      # ctlptl drives the `kind` binary directly to create the cluster below,
      # and `seal ci` shells out to kubectl (python/src/seal/seal.py). Both
      # ship with GitHub's hosted runner image, so this is a no-op there; a
      # stock self-hosted runner image carries neither.
      shell: bash
      run: |
        if ! command -v kubectl >/dev/null 2>&1; then
          curl -fsSL -o "$HOME/.local/bin/kubectl" \
            "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
        fi
        if ! command -v kind >/dev/null 2>&1; then
          curl -fsSL -o "$HOME/.local/bin/kind" \
            https://github.com/kubernetes-sigs/kind/releases/latest/download/kind-linux-amd64
          chmod +x "$HOME/.local/bin/kind"
        fi
        kubectl version --client
        kind version

    - name: Install rsync
      # Tilt's syncback extension is how each service's junit/coverage output
      # gets copied out of its test container and into tests-results/ (see
      # tilt/seal/tests.Tiltfile), and it shells out to a local rsync -- its
      # own verify_rsync.sh refuses to load the extension without one, which
      # fails the Tiltfile at parse time, before any test runs. GitHub's
      # hosted image ships rsync; a stock self-hosted runner image does
      # not.
      #
      # Installed out of a container rather than with a package manager,
      # because `apt-get install` needs root and this job assumes no sudo
      # (see "Prepare a writable tool directory" above). The binary is
      # invoked through its own image's dynamic loader and libraries, so it
      # doesn't have to match whatever libc the runner image carries.
      shell: bash
      run: |
        if command -v rsync >/dev/null 2>&1; then
          rsync --version | head -1
          exit 0
        fi
        TOOLS="$HOME/.local/bin"
        # Staged under $RUNNER_TEMP, not straight into $TOOLS: a bind mount's
        # source path is resolved by the *daemon*, which on a dind runner is
        # a different container from this one. $HOME/.local/bin exists here
        # and not there, so binding it would silently mount an empty
        # directory and drop the extraction on the floor. $RUNNER_TEMP is
        # under the work volume both containers share, at the same path.
        STAGE="${RUNNER_TEMP}/rsync-extract"
        mkdir -p "$STAGE"
        docker run --rm -v "$STAGE:/out" debian:trixie-slim sh -c '
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends rsync
          mkdir -p /out/libs
          cp /usr/bin/rsync /out/rsync.bin
          ldd /usr/bin/rsync | grep -oE "/[^ ]*\.so[^ ]*" | xargs -r -I{} cp -L {} /out/libs/
        '
        mkdir -p "$TOOLS/rsync-libs"
        cp "$STAGE/rsync.bin" "$TOOLS/rsync.bin"
        cp "$STAGE"/libs/* "$TOOLS/rsync-libs/"
        chmod +x "$TOOLS/rsync.bin" "$TOOLS/rsync-libs/ld-linux-x86-64.so.2"
        cat > "$TOOLS/rsync" <<EOF
        #!/bin/sh
        exec "$TOOLS/rsync-libs/ld-linux-x86-64.so.2" \
          --library-path "$TOOLS/rsync-libs" "$TOOLS/rsync.bin" "\$@"
        EOF
        chmod +x "$TOOLS/rsync"
        rsync --version | head -1

    - name: Write the per-run cluster script
      # Every run below starts from a cluster with nothing on it. Reusing one
      # across overlays leaves the previous overlay's objects applied, and an
      # object the next overlay doesn't declare keeps running -- so a promise
      # can be kept by a container the shape under test removed. That is a
      # false green, and a gate that can produce one is worth less than no
      # gate at all.
      #
      # A file rather than a shell function: each step below is its own
      # shell, so a function would have to be repeated in each of them, and
      # with it this reasoning.
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/fresh-cluster.sh" <<'EOF'
        #!/bin/sh
        set -e
        # The delete is best-effort: the first run of a job has no cluster to
        # remove, which is not a failure.
        ctlptl delete cluster kind >/dev/null 2>&1 || true
        # The registry is a container of its own and survives the cluster, so
        # what a previous run pushed is still there to pull -- and the buildx
        # layer cache makes the rebuild mostly a cache hit.
        ctlptl create cluster kind --registry=ctlptl-registry
        EOF
        chmod +x "$RUNNER_TEMP/fresh-cluster.sh"

    - name: Set up Docker Buildx
      # Default 'docker' driver can't talk to external cache exporters
      # (type=gha below); this swaps in the docker-container driver that can,
      # and makes it the active builder for the rest of this job.
      uses: docker/setup-buildx-action@v4

    - name: Expose GitHub Actions cache to buildx
      # A raw `docker buildx build` (which is what cached_docker_build's
      # custom_build() shells out to -- see tilt/docker_build at the repo root)
      # doesn't get the GitHub Actions cache credentials automatically the
      # way docker/build-push-action does; this exports them into
      # $GITHUB_ENV so buildx's --cache-from/--cache-to type=gha can
      # authenticate. Scoped to this run's own repository, i.e. whichever
      # project used this action.
      uses: crazy-max/ghaction-github-runtime@v4

    - name: Set up credential providers
      if: inputs.provider_setup != ''
      working-directory: ${{ inputs.project_dir }}
      env:
        SEAL_PROVIDER_TOKEN: ${{ inputs.provider_token }}
      # What a project's declared providers need before `seal ci` can reach
      # them: a CLI on PATH, and a session. Both are the project's to
      # supply, because both are facts about a store this workflow has no
      # reason to know the name of.
      #
      # Anything exported to $GITHUB_ENV here survives into the runs below,
      # which is what a CLI keeping its session in an environment variable
      # needs -- `seal ci` shells out to it, so a session confined to this
      # step would be gone by the time it is used.
      shell: bash
      run: ${{ inputs.provider_setup }}

    # Each run below is one `seal ci` a developer or an agent can type
    # verbatim. That is a requirement rather than a convenience: the second
    # overlay is an *additional* gate precisely because the local loop runs
    # the primary one, and a red gate nobody can reproduce is a red gate
    # nobody can act on. Nothing in a step may be something the CLI cannot
    # do.
    #
    # Each moves its results aside under the overlay's own name before the
    # next run overwrites tests-results/, and does so whether the run passed
    # or failed -- a failed run's report is the one somebody needs to read.

    - name: Verify the promises, and each service's own tests
      working-directory: ${{ inputs.project_dir }}
      env:
        # Which store each `.env` reference resolves against (see
        # python/src/seal/providers.py). Empty leaves the project's own
        # `default_env` to say.
        SEAL_CREDENTIALS_ENV: ${{ inputs.credentials_env }}
        # Tells cached_docker_build() (tilt/docker_build at the repo root) to
        # build via buildx with GitHub Actions layer caching instead of
        # Tilt's plain docker_build(). Local `tilt up` never sets this.
        SEAL_BUILDX_CACHE: "1"
        K8S_OVERLAY: ${{ inputs.k8s_overlay }}
        # Each one of two words by the time it gets here, and never both
        # false -- the plan step above refuses anything else.
        RUN_SERVICE_TESTS: ${{ inputs.run_service_tests }}
        RUN_OUTCOMES: ${{ inputs.run_outcomes }}
      shell: bash
      run: |
        # `seal ci` runs `tilt ci` against this project's own, checked-in
        # root Tiltfile (see /rfcs/0002-declaration-by-structure.md at the repo root),
        # building each service's own test stage and running its suite
        # inside the container, then reading the promises. The CLI is this
        # action's own repository, checked out beside it -- so it is the
        # same revision as this file, and needs no credential to fetch.
        #
        # This is the only run that can execute a service's own tests, and
        # --build_type is the whole of that: a suite runs inside the
        # service's container, so it is there only in images built at `test`
        # (see /rfcs/0008-run-axes.md at the repo root). Which also makes
        # this overlay part of their contract, since it decides the database
        # they connect to and the Secret their .env resolved into. Asked for
        # without them, this run builds what a real environment runs and
        # reads the promises against that -- what an additional shape is
        # verified at, on the shape the local loop brings up.
        build_type=test
        if [ "$RUN_SERVICE_TESTS" = "false" ]; then
          build_type=runtime
        fi
        # The promises are read because this is a gate, so the flag appears
        # only to say they are not: a run asking for them has nothing to
        # pass, and one that leaves them out is still a `seal ci` somebody
        # can type -- with each service's own tests and the readiness gate,
        # and no claim about what the application promises.
        outcomes=()
        if [ "$RUN_OUTCOMES" = "false" ]; then
          outcomes=(--run_outcomes false)
        fi
        # Said where the run happens, because a run reading neither half is
        # not the merge gate and nothing in its results will say so -- it has
        # none. What it still gates on is every resource coming up.
        if [ "$RUN_SERVICE_TESTS" = "false" ] && [ "$RUN_OUTCOMES" = "false" ]; then
          echo "::warning::Neither the service tests nor the promises are being read. This run gates on readiness alone."
        fi
        "$RUNNER_TEMP/fresh-cluster.sh"
        status=0
        uvx --from ${{ github.action_path }}/../../python seal ci -- \
          --k8s_overlay "$K8S_OVERLAY" --build_type "$build_type" "${outcomes[@]}" || status=$?
        mkdir -p "$RUNNER_TEMP/seal-results"
        if [ -d tests-results ]; then
          mv tests-results "$RUNNER_TEMP/seal-results/$K8S_OVERLAY"
        fi
        exit $status

    - name: Verify the promises on each additional overlay
      # Runs even when the gate above went red, so one failing shape doesn't
      # hide what the others would have said. The job still fails; this
      # decides only how much is known when it does.
      if: (!cancelled())
      working-directory: ${{ inputs.project_dir }}
      env:
        SEAL_CREDENTIALS_ENV: ${{ inputs.credentials_env }}
        SEAL_BUILDX_CACHE: "1"
      shell: bash
      run: |
        # --build_type runtime: the images a real environment runs. They
        # carry the service and not its suite, so these runs verify the
        # promises alone -- a property of the images rather than a policy.
        # The suite still runs, because `seal ci` is a gate whatever it
        # builds (see tilt/seal/config.Tiltfile).
        if [ ! -f "$RUNNER_TEMP/additional-overlays" ]; then
          echo "The run failed before it could say which shapes to verify." >&2
          exit 1
        fi
        status=0
        while read -r overlay; do
          [ -n "$overlay" ] || continue
          echo "::group::$overlay"
          "$RUNNER_TEMP/fresh-cluster.sh"
          uvx --from ${{ github.action_path }}/../../python seal ci -- \
            --k8s_overlay "$overlay" --build_type runtime || status=$?
          mkdir -p "$RUNNER_TEMP/seal-results"
          if [ -d tests-results ]; then
            mv tests-results "$RUNNER_TEMP/seal-results/$overlay"
          fi
          echo "::endgroup::"
        done < "$RUNNER_TEMP/additional-overlays"
        exit $status

    - name: Publish the images
      # `success()` rather than the input alone: this is what makes
      # publishing depend on the gates instead of racing them. Tilt pushes
      # when it deploys, so a --publish_images flag on a gate run would push
      # before a single promise had been read.
      #
      # Compared against the string, never read for truthiness. Every input
      # an action receives is a string, and `if: inputs.publish_images` is
      # therefore true for the literal "false" -- which runs this step for a
      # caller that asked for no publishing at all, and it then fails on its
      # own empty-overlay guard below.
      if: success() && inputs.publish_images == 'true'
      working-directory: ${{ inputs.project_dir }}
      env:
        SEAL_CREDENTIALS_ENV: ${{ inputs.credentials_env }}
        SEAL_BUILDX_CACHE: "1"
        PUBLISH_K8S_OVERLAY: ${{ inputs.publish_k8s_overlay }}
      shell: bash
      run: |
        if [ -z "$PUBLISH_K8S_OVERLAY" ]; then
          echo "publish_images is true but publish_k8s_overlay names no overlay." >&2
          echo "Publishing deploys a shape and lets Tilt push what it built, so it has to name one -- the one the deployment will use." >&2
          exit 1
        fi
        # --run_outcomes false: this run is not a gate. The promises were
        # read by the runs above, against these same images, and reading them
        # again here would add nothing but a way for a publish to fail.
        "$RUNNER_TEMP/fresh-cluster.sh"
        uvx --from ${{ github.action_path }}/../../python seal ci -- \
          --k8s_overlay "$PUBLISH_K8S_OVERLAY" --build_type runtime \
          --publish_images --run_outcomes false

    - name: Read what each run found
      id: collect
      # Runs whatever the gates said, because a failed run's results are the
      # ones somebody needs: the whole point of handing them back is that the
      # caller can say which promise broke on which shape.
      if: (!cancelled())
      working-directory: ${{ inputs.project_dir }}
      env:
        PRIMARY_K8S_OVERLAY: ${{ inputs.k8s_overlay }}
        RUN_SERVICE_TESTS: ${{ inputs.run_service_tests }}
        RUN_OUTCOMES: ${{ inputs.run_outcomes }}
      shell: bash
      run: |
        # Through the CLI, not a parser of this file's own: `seal
        # _tests-results` reads the reports with the same junit.py that
        # decided each service's verdict during the run (see
        # python/src/seal/junit.py), so what a caller is handed cannot
        # disagree with what the gate concluded.
        #
        # Each --run names one results directory and the overlay to file it
        # under. A directory that isn't there -- a shape whose run died
        # before producing anything -- is rendered as a run that produced
        # nothing, which is a failure rather than an absence. That is exactly
        # the claim a gate's results must never be readable as, and it is
        # also why a run asked to read neither half is not named here at all:
        # it has no reports by design, which is a different thing from having
        # lost them, and only this file knows which of the two it is.
        runs=()
        if [ "$RUN_SERVICE_TESTS" = "true" ] || [ "$RUN_OUTCOMES" = "true" ]; then
          runs+=(--run "$PRIMARY_K8S_OVERLAY=$RUNNER_TEMP/seal-results/$PRIMARY_K8S_OVERLAY")
        fi
        if [ -f "$RUNNER_TEMP/additional-overlays" ]; then
          while read -r overlay; do
            [ -n "$overlay" ] || continue
            runs+=(--run "$overlay=$RUNNER_TEMP/seal-results/$overlay")
          done < "$RUNNER_TEMP/additional-overlays"
        fi
        if [ ${#runs[@]} -eq 0 ]; then
          # No run was asked to report anything, so there is nothing to
          # render and nothing a reader could mistake for a run that lost its
          # reports. Such a run says what it found through the job's own
          # status, which is the whole of what a readiness gate has to say.
          echo 'results={}' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Assigned before it is written, so a command that failed fails the
        # step: `echo "results=$(...)"` would report the echo's own success
        # and hand the caller an empty output to guess at.
        # Kept out of `runs` above, which is what the emptiness check counts:
        # a switch is not a run, and one counted as such would send a command
        # naming no results directory at all.
        #
        # A run that was not asked to read the promises has no verdict for any
        # of them, which from the results alone is indistinguishable from a
        # suite where every test failed to write one -- and that is a failure.
        # Only this file knows which of the two it is, so it says.
        promises=()
        if [ "$RUN_OUTCOMES" != "true" ]; then
          promises+=(--no-outcomes)
        fi
        results="$(uvx --from ${{ github.action_path }}/../../python seal _tests-results "${runs[@]}" "${promises[@]}")"
        # One line of JSON, so it needs none of $GITHUB_OUTPUT's delimiter
        # syntax: a newline inside a rendered value is escaped by the JSON
        # itself.
        echo "results=$results" >> "$GITHUB_OUTPUT"
        # And to a file, for the rendering below and for whoever downloads
        # the artifact: an output is readable by this workflow run alone,
        # and the reading is the part somebody coming back to a failed run
        # wants next to the reports themselves.
        mkdir -p "$RUNNER_TEMP/seal-results"
        printf '%s\n' "$results" > "$RUNNER_TEMP/seal-results/results.json"

    - name: Render what each run found
      # A page, in the artifact this run already uploads. It publishes
      # nothing and needs no scope: what it adds is that the results a
      # project is handed can be read by a person as well as parsed by a
      # workflow -- an artifact download is otherwise a directory of XML.
      #
      # Which check, comment or dashboard those results become is still the
      # project's own decision, and `actions/report` is how a project that
      # wants one asks for it (see /rfcs/0015-reporting-what-a-run-found.md
      # at the repo root).
      #
      # Rendered by the CLI from what `seal _tests-results` printed, so the
      # page cannot say a promise held where the gate said it broke: there
      # is one reader of a report, and everything downstream renders what it
      # said.
      if: (!cancelled())
      shell: bash
      run: |
        if [ ! -f "$RUNNER_TEMP/seal-results/results.json" ]; then
          # Either no run was asked to report anything, or one died before it
          # could read what it found. Both leave nothing to render, and the
          # step above has already said which it was.
          echo "Nothing was read, so there is nothing to render."
          exit 0
        fi
        uvx --from ${{ github.action_path }}/../../python seal _report \
          --results "$RUNNER_TEMP/seal-results/results.json" \
          --html "$RUNNER_TEMP/seal-results/index.html" \
          --markdown "$RUNNER_TEMP/seal-results/report.md" \
          --source "${{ github.repository }}@${{ github.sha }}"

    - name: Upload test results artifact
      id: upload
      uses: actions/upload-artifact@v7
      if: (!cancelled())
      with:
        name: ${{ inputs.results_artifact }}
        # The directory itself, not a glob of the files under it: that fixes
        # the artifact's internal root, so a caller always finds an overlay's
        # results at '<overlay>/<service>/junit.xml' no matter how many
        # services this project has -- and the reading and the rendered page
        # beside them at the root. A glob would instead root the artifact at
        # whatever the matched files' deepest common ancestor happens to be,
        # which shifts as services are added or removed.
        path: ${{ runner.temp }}/seal-results
        retention-days: ${{ inputs.results_retention_days }}
        # A run that failed before the first overlay produced anything is a
        # normal outcome to have nothing to upload for. The `results` output
        # says so in its own right, which is why this is not a failure here:
        # a caller reads that rather than inferring anything from a download
        # that found nothing.
        if-no-files-found: ignore
