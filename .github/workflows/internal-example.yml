name: "Internal: example (angular-django)"

# The only project-specific piece of CI in this repo: it points the generic
# `ci` action at `examples/angular-django/`. A different project would copy
# this file and point `project_dir` at itself -- everything here is reusable
# as-is: this file never enumerates an app's own variable/secret names, since
# `seal ci` resolves each service's own `.env` through whatever providers
# that project declares (see /rfcs/0006-credential-resolution.md at the repo
# root), the same way `seal up` does for local dev.
#
# Building for a real environment, applying anything to a cluster, and
# sealing credentials for one are all specific to whoever is deploying --
# their registry, their cluster, their domain -- and deliberately out of
# scope here. This file only points the action at a project.
#
# Two things about the shape of the job below are worth knowing:
#
# - It binds `environment:` itself. That is what makes every `secrets.X` and
#   `vars.X` it reads resolve against that Environment rather than at
#   repository scope, and the action then receives values rather than names.
# - It re-exposes the action's step outputs as job outputs, because the jobs
#   after it read them through `needs.tests.outputs.*`. An action's outputs
#   belong to the step that ran it.
#
# `permissions:` is `contents: read` and nothing else. What a run found comes
# back as outputs for this file to do something with, so the write scopes
# publishing a check needs are declared on the job that publishes it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: "Branch name or SHA to check out."
        required: false
        type: string

jobs:
  tests:
    runs-on: ubuntu-latest
    # Bound here, by the calling job, which is what an action makes possible:
    # `provider_token` below resolves against this Environment rather than at
    # repository scope, and the action receives the value.
    environment: dev
    permissions:
      contents: read
    # Re-exposed from the action's own step outputs, so the jobs below can
    # read them. An action's outputs belong to the step; a job's belong to
    # whatever `needs:` it.
    outputs:
      overlays: ${{ steps.seal.outputs.overlays }}
      results: ${{ steps.seal.outputs.results }}
      results_artifact: ${{ steps.seal.outputs.results_artifact }}
      results_artifact_url: ${{ steps.seal.outputs.results_artifact_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - id: seal
        uses: ./actions/ci
        with:
          project_dir: examples/angular-django
          # The overlay this example is developed in, and the one `seal up`
          # brings up by default -- see its root Tiltfile's
          # select_k8s_overlay(default_overlay='dev'). Named here rather than
          # left implicit because the gate has to state which shape it
          # verified.
          k8s_overlay: dev
          # The shape a real environment runs: no dev server, the built
          # bundle served by nginx, and the api's environment split across a
          # ConfigMap and a Secret (see examples/angular-django/k8s/README.md).
          # The same promises are verified against it, which is what a second
          # shape is for -- a container removed, static files served
          # differently and a pod built from a different set of objects are
          # exactly what a dev server hides.
          additional_k8s_overlays: '["non-dev"]'
          # No registry to push to: the example's default_registry() names a
          # placeholder, so there is nothing this repo's own CI could publish.
          publish_images: false
          # provider_setup is deliberately not passed. This example's
          # services declare no provider at all: their `.env` files hold
          # literals and `k8s://` markers, so nothing here reaches a password
          # manager and there is no CLI to install or log in to. That is the
          # case worth demonstrating first -- a project should not have to
          # say it uses nothing.
          #
          # A project that does keep secrets in a store passes its own setup
          # and its own credential, like this:
          #
          #     provider_setup: |
          #       curl -fsSL https://example.invalid/install.sh | bash
          #       echo "$SEAL_PROVIDER_TOKEN" | its-cli login
          #     provider_token: ${{ secrets.WHATEVER_IT_CALLS_ITS_TOKEN }}
          #
          # Read in this job, which binds `environment: dev`, so it is that
          # Environment's own secret that reaches `provider_setup`.

  report:
    # What a project does with its results is the project's own business, so
    # it happens here rather than in the `ci` action -- which reads the
    # reports and hands back both what they say (the `results` output) and the
    # reports themselves (an artifact, named by `results_artifact`). This
    # project publishes a check per shape from the reports.
    #
    # The write scopes live here, on the job that actually needs them, rather
    # than being something every user of the action has to grant it.
    needs: tests
    # Empty only when the run died before it could say which shapes it was
    # going to verify, which leaves nothing to report under -- and a
    # fromJSON('') that would fail this job on top of the one that already
    # failed.
    if: (!cancelled()) && needs.tests.outputs.overlays != ''
    # Hosted, whatever the build ran on:
    # publish-unit-test-result-action is a Docker-container action, and
    # GitHub pre-pulls the image of every such action referenced in a job,
    # before that job's first step and regardless of any `if:`. Keeping it in
    # a job of its own is what lets the build target a runner that has to
    # bring its own Docker daemon up.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    strategy:
      # One check per overlay: two result sets in one pull request are two
      # different claims -- "the promises hold on the shape we work in" and
      # "they hold on the shape that ships" -- and a reader deciding whether
      # to merge needs to see which one went red.
      fail-fast: false
      matrix:
        overlay: ${{ fromJSON(needs.tests.outputs.overlays) }}

    steps:
    - name: Download the reports
      id: download
      # A build that failed before any service produced results uploads no
      # artifact at all, which is a normal outcome worth reporting nothing
      # for -- not a reason to fail this job on top of the one that already
      # failed. The `summary` job below says so from the `results` output,
      # which needs no artifact to be readable.
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.tests.outputs.results_artifact }}
        path: tests-results

    - name: Publish Test Results
      if: steps.download.outcome == 'success'
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        # The artifact is laid out as '<overlay>/<service>/junit.xml', so
        # this reaches every service's own report and every outcome's alike
        # -- both the test stage and the outcome runners write JUnit XML.
        files: |
          tests-results/${{ matrix.overlay }}/**/junit.xml
        check_name: "Test Results (${{ matrix.overlay }})"

  summary:
    # The other half of what the action hands back, and the reason
    # it hands back a reading as well as the reports: a shape whose run died
    # before writing a single report has nothing for the checks above to
    # publish, and looks from them exactly like a shape that was never asked
    # for. `results` says which it was, without an artifact to download.
    #
    # Through seal's own `report` action, which renders that reading into
    # this job's summary and into one comment on the pull request -- updated
    # in place, so twenty pushes leave one current report rather than twenty
    # stale ones. A separate job because the comment needs
    # `pull-requests: write`, and the gate has no business holding that (see
    # /rfcs/0015-reporting-what-a-run-found.md at the repo root).
    needs: tests
    if: (!cancelled()) && needs.tests.outputs.results != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - uses: ./actions/report
      with:
        results: ${{ needs.tests.outputs.results }}
        title: "Seal results (angular-django)"
        # Where the recordings a failure left behind can be fetched. A file
        # inside an artifact has no address of its own, so the comment names
        # the path and links the archive.
        artifact_url: ${{ needs.tests.outputs.results_artifact_url }}
        # Names which comment this run replaces. One use of the action here,
        # so one key -- a repository gating two projects in one workflow
        # gives each its own, or each keeps overwriting the other's report.
        comment_key: angular-django
        source: "${{ github.repository }}@${{ github.sha }}"
