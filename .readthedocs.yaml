# Read the Docs build for the user documentation in docs/. The RFCs in rfcs/
# are not part of this site: they are the design record for people changing
# seal itself, and they live in the repository they describe.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # A broken cross-reference is a page that sends a reader nowhere, which is
  # worse than a page that doesn't build -- so the build refuses to publish
  # one.
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt

formats:
  - pdf
